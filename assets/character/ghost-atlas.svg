    <g transform="translate(256 128)"><use href="#wisp-stun"/><path d="M265 148 259 144m46 4 6-4" stroke="#a8f5ff" stroke-width="2" stroke-linecap="round"/></g>
    <g transform="translate(320 128)"><use href="#wisp-grin"/><path d="m350 133 2 5 5 2-5 2-2 5-2-5-5-2 5-2Zm22 35 1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5Z" fill="#fff1a6"/></g>
    <!-- Row 3: defeat/eyes-return, rebuild-1, rebuild-2, rebuild-3, rebuild-4, victory -->
