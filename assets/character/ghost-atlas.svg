      <ellipse cx="40" cy="29" rx="5.5" ry="7" fill="#fff"/>
      <ellipse cx="27.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <ellipse cx="41.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <path d="M12 38c-1-12 2-24 10-26 6-4 14-4 20 0 5 4 6 10 5 16l-1 8-6-4-6 6-6-5-7 5-5-5-5 4Z" fill="url(#wisp-body)" fill-opacity=".45" stroke="#b9d7ff" stroke-width="1.2" stroke-linejoin="round" opacity=".6"/>
      <ellipse cx="26" cy="29" rx="5.2" ry="7" fill="#fff" opacity=".9"/>
      <ellipse cx="40" cy="29" rx="5.2" ry="7" fill="#fff" opacity=".9"/>
      <circle cx="32" cy="32" r="22" fill="url(#wisp-glow)" opacity=".25"/>
    </g>
    <g id="ghost-regen-3">
      <!-- Body more than half restored -->
      <path d="M11 38c-2-14 3-26 12-30 8-4 18-3 25 3 6 6 8 13 6 22l-1 10-7-5-7 7-7-6-8 6-6-7-7 5Z" fill="url(#wisp-body)" fill-opacity=".72" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" opacity=".8"/>
      <path d="M16 38c-1-12 3-22 10-26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/>
      <ellipse cx="26" cy="29" rx="5.2" ry="7" fill="#fff"/>
      <ellipse cx="40" cy="29" rx="5.2" ry="7" fill="#fff"/>
      <ellipse cx="27.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <ellipse cx="41.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <path d="M29 41q4 3 8 0" fill="none" stroke="#344b6c" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    <g id="ghost-regen-4">
      <!-- Nearly complete body, still faintly translucent -->
      <path d="M11 38c-2-14 3-26 12-30 8-4 18-3 25 3 6 6 8 15 6 26l-1 11-7-5-7 7-7-6-8 6-6-7-7 5Z" fill="url(#wisp-body)" fill-opacity=".9" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" opacity=".95"/>
      <path d="M16 38c-1-12 3-22 10-26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".85"/>
      <ellipse cx="26" cy="29" rx="5.2" ry="7" fill="#fff"/>
      <ellipse cx="40" cy="29" rx="5.2" ry="7" fill="#fff"/>
      <ellipse cx="27.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <ellipse cx="41.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <path d="M29 41q4 3 8 0" fill="none" stroke="#344b6c" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    <g id="ghost-regen-complete">
