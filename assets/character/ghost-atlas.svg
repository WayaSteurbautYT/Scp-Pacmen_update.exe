      <circle cx="26" cy="29" r="2" fill="#438bff"/><circle cx="40" cy="29" r="2" fill="#438bff"/>
    </g>
    <g id="ghost-chomp-attacker">
      <!-- Pacman-style chomp mouth overlay for the attacker, shows during bite -->
      <circle cx="32" cy="32" r="28" fill="#ffd84d"/>
      <path d="M32 10 L 40 14 A 8 8 0 0 1 40 50 Z" fill="#08111f"/>
      <path d="M24 10 L 16 14 A 8 8 0 0 0 16 50 Z" fill="#ff9b50"/>
      <circle cx="25" cy="20" r="2.5" fill="#172a50"/>
      <circle cx="39" cy="20" r="2.5" fill="#172a50"/>
    </g>
    <g id="ghost-panic-flee">
