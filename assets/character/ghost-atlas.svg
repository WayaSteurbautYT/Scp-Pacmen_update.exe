      <use href="#wisp-shape" opacity=".6"/>
      <path d="M14 44 q -8 8 -16 0 q -2 -3 -2 -3 l 0 -2 q 0 3 -8 3 z" fill="#ff6c87" opacity=".7"/>
      <path d="M48 44 q 8 8 16 0 q 2 -3 2 -3 l 0 -2 q 0 3 8 3 z" fill="#ff6c87" opacity=".7"/>
      <path d="m20 20 6 6m-10 0 6 -6m8 4 6 6m-10 0 6 -6" stroke="#fff" stroke-width="1.5" opacity=".7"/>
    </g>
