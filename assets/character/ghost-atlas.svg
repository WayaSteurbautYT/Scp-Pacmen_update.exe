<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <title>Neon Maze wisp character atlas with bite & regen sequence</title>
  <desc>36 transparent 64-pixel frames including idle, move, attack, damage, vulnerable, stun, stealth, phase, defeat, rebuild, and a full bite/chomp/eyes-only/regen sequence.</desc>
  <defs>
    <linearGradient id="wisp-body" x1=".22" y1=".05" x2=".82" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".5" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#c9d8f1"/>
    </linearGradient>
    <radialGradient id="wisp-glow">
      <stop stop-color="#d8faff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#83cfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phase-glow">
      <stop stop-color="#e4d9ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#9c6eff" stop-opacity=".05"/>
    </linearGradient>
    <g id="wisp-shape">
      <path d="M11 38c-2-14 3-26 12-30 8-4 18-3 25 3 6 6 8 15 6 27l-1 12-7-5-7 7-7-6-8 6-6-7-7 5Z" fill="url(#wisp-body)" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M16 38c-1-12 3-22 10-26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".68"/>
      <ellipse cx="26" cy="29" rx="5.2" ry="7" fill="#fff"/>
      <ellipse cx="40" cy="29" rx="5.2" ry="7" fill="#fff"/>
      <ellipse cx="27.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <ellipse cx="41.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <path d="M29 41q4 3 8 0" fill="none" stroke="#344b6c" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    <g id="wisp-grin">
      <use href="#wisp-shape"/>
      <path d="M28 40q4 7 9 0" fill="#344b6c"/>
      <path d="m31 42 2 0 0 3-2 0Z" fill="#fff"/>
    </g>
    <g id="wisp-hurt">
      <path d="M12 40c-2-13 3-26 12-31 9-5 19-3 25 4 5 7 6 17 3 28l-1 9-7-3-7 5-7-5-8 5-6-6-6 4Z" fill="url(#wisp-body)" stroke="#ff9aa9" stroke-width="2" stroke-linejoin="round"/>
      <path d="M23 26l6 6m0-6-6 6m12-6 6 6m0-6-6 6" stroke="#304660" stroke-width="2" stroke-linecap="round"/>
      <path d="m52 12 2.5 5 5 2.5-5 2.5-2.5 5-2.5-5-5-2.5 5-2.5Z" fill="#ff819b"/>
    </g>
    <g id="wisp-vulnerable">
      <circle cx="32" cy="32" r="29" fill="url(#wisp-glow)"/>
      <use href="#wisp-shape"/>
      <path d="M25 44h14" stroke="#3878dc" stroke-width="2" stroke-linecap="round"/>
      <circle cx="26" cy="29" r="2" fill="#438bff"/><circle cx="40" cy="29" r="2" fill="#438bff"/>
    </g>
    <g id="wisp-stun">
      <use href="#wisp-shape"/>
      <path d="m24 29 5 0m9 0h5" stroke="#233b5a" stroke-width="2" stroke-linecap="round"/>
      <path d="m28 41 3 2 3-2 3 2" fill="none" stroke="#405773" stroke-width="1.7" stroke-linecap="round"/>
      <path d="m18 13 2.5 5 5 2.5-5 2.5-2.5 5-2.5-5-5-2.5 5-2.5Z" fill="#fff0aa"/>
      <path d="m48 10 2 4 4 2-4 2-2 4-2-4-4-2 4-2Z" fill="#a8f5ff"/>
    </g>
    <g id="wisp-fright">
      <!-- Ghost startled/frightened: wider eyes, tight mouth, small sweat drop -->
      <path d="M11 38c-2-14 3-26 12-30 8-4 18-3 25 3 6 6 8 15 6 27l-1 12-7-5-7 7-7-6-8 6-6-7-7 5Z" fill="url(#wisp-body)" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M16 38c-1-12 3-22 10-26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".68"/>
      <ellipse cx="24" cy="26" rx="4.2" ry="7" fill="#fff"/>
      <ellipse cx="42" cy="26" rx="4.2" ry="7" fill="#fff"/>
      <ellipse cx="25.5" cy="28" rx="2" ry="3.5" fill="#17344e"/>
      <ellipse cx="43.5" cy="28" rx="2" ry="3.5" fill="#17344e"/>
      <path d="M29 42 q 4 -3 8 0" fill="none" stroke="#17344e" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="16" cy="14" r="2" fill="#fff" opacity=".9"/>
    </g>
    <!-- Bite / chomp sequence defs -->
    <g id="ghost-bite-1">
      <!-- Ghost with one bite mark taken out of lower-left side -->
      <path d="M11 38c-2-14 3-26 12-30 8-4 18-3 25 3 6 6 8 15 6 27l-1 12-7-5-7 7-7-6-8 6-6-7-7 5Z" fill="url(#wisp-body)" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M16 38c-1-12 3-22 10-26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".68"/>
      <ellipse cx="26" cy="29" rx="5.2" ry="7" fill="#fff"/>
      <ellipse cx="40" cy="29" rx="5.2" ry="7" fill="#fff"/>
      <ellipse cx="27.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <ellipse cx="41.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <path d="M29 41q4 3 8 0" fill="none" stroke="#344b6c" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M15 44 q -6 6 -12 0 q -2 -3 -2 -3 l 0 -2 q 0 3 -6 3 z" fill="#2a0a14" opacity=".95" stroke="#ff6c87" stroke-width="1.2"/>
    </g>
    <g id="ghost-bite-2">
      <!-- Two bite marks, body starting to fade at bottom -->
      <path d="M11 38c-2-14 3-26 12-30 8-4 18-3 25 3 6 6 8 15 6 20l-1 10-7-5-7 7-7-6-8 6-6-7-7 5Z" fill="url(#wisp-body)" fill-opacity=".78" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" opacity=".82"/>
      <path d="M16 38c-1-12 3-22 10-26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".5"/>
      <ellipse cx="26" cy="29" rx="5.2" ry="7" fill="#fff"/>
      <ellipse cx="40" cy="29" rx="5.2" ry="7" fill="#fff"/>
      <ellipse cx="27.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <ellipse cx="41.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <path d="M15 44 q -6 6 -12 0 q -2 -3 -2 -3 l 0 -2 q 0 3 -6 3 z" fill="#2a0a14" opacity=".95" stroke="#ff6c87" stroke-width="1.2"/>
      <path d="M45 44 q 6 6 12 0 q 2 -3 2 -3 l 0 -2 q 0 3 6 3 z" fill="#2a0a14" opacity=".95" stroke="#ff6c87" stroke-width="1.2"/>
      <path d="M22 52 q 8 8 16 0 q 2 -3 2 -3 l 0 -2 q 0 3 -8 3 z" fill="#2a0a14" opacity=".8" stroke="#ff6c87" stroke-width="1"/>
    </g>
    <g id="ghost-bite-3">
      <!-- Body half consumed, lower section dissolving -->
      <path d="M11 38c-2-14 3-26 12-30 8-4 18-3 25 3 6 6 8 12 6 14l-1 7-7-5-7 7-7-6-8 6-6-7-7 5Z" fill="url(#wisp-body)" fill-opacity=".5" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" opacity=".6"/>
      <path d="M16 38c-1-12 3-22 10-26" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".35"/>
      <ellipse cx="26" cy="29" rx="5.2" ry="7" fill="#fff" opacity=".9"/>
      <ellipse cx="40" cy="29" rx="5.2" ry="7" fill="#fff" opacity=".9"/>
      <ellipse cx="27.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <ellipse cx="41.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <path d="M15 44 q -6 6 -12 0 q -2 -3 -2 -3 l 0 -2 q 0 3 -6 3 z" fill="#2a0a14" opacity=".95" stroke="#ff6c87" stroke-width="1.2"/>
      <path d="M45 44 q 6 6 12 0 q 2 -3 2 -3 l 0 -2 q 0 3 6 3 z" fill="#2a0a14" opacity=".95" stroke="#ff6c87" stroke-width="1.2"/>
      <path d="M22 50 q 10 10 20 0 q 2 -3 2 -3 l 0 -2 q 0 3 -10 3 z" fill="#2a0a14" opacity=".9" stroke="#ff6c87" stroke-width="1.2"/>
    </g>
    <g id="ghost-bite-4">
      <!-- Body mostly gone, just upper section + eyes -->
      <path d="M11 38c-2-14 3-26 12-30 8-4 18-3 25 3 6 6 8 9 6 6l-1 4-7-5-7 7-7-6-8 6-6-7-7 5Z" fill="url(#wisp-body)" fill-opacity=".28" stroke="#fff" stroke-width="1" stroke-linejoin="round" opacity=".4"/>
      <path d="M16 38c-1-12 3-22 10-26" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".2"/>
      <ellipse cx="26" cy="29" rx="5.2" ry="7" fill="#fff" opacity=".8"/>
      <ellipse cx="40" cy="29" rx="5.2" ry="7" fill="#fff" opacity=".8"/>
      <ellipse cx="27.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <ellipse cx="41.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <path d="M15 44 q -6 6 -12 0 q -2 -3 -2 -3 l 0 -2 q 0 3 -6 3 z" fill="#2a0a14" opacity=".95" stroke="#ff6c87" stroke-width="1.2"/>
      <path d="M45 44 q 6 6 12 0 q 2 -3 2 -3 l 0 -2 q 0 3 6 3 z" fill="#2a0a14" opacity=".95" stroke="#ff6c87" stroke-width="1.2"/>
    </g>
    <g id="ghost-eyes-only">
      <!-- Just the eyes floating, body fully consumed -->
      <ellipse cx="26" cy="29" rx="5.5" ry="7" fill="#fff"/>
      <ellipse cx="40" cy="29" rx="5.5" ry="7" fill="#fff"/>
      <ellipse cx="27.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <ellipse cx="41.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <circle cx="32" cy="32" r="22" fill="url(#wisp-glow)" opacity=".35"/>
    </g>
    <g id="ghost-regen-1">
      <!-- Eyes only + faint outline beginning -->
      <ellipse cx="26" cy="29" rx="5.5" ry="7" fill="#fff"/>
      <ellipse cx="40" cy="29" rx="5.5" ry="7" fill="#fff"/>
      <ellipse cx="27.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <ellipse cx="41.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
      <path d="M14 38c-1-10 2-20 8-24 5-3 12-3 17 1 3 3 4 8 4 12l-1 5-5-3-5 5-5-4-6 4-4-4-4 3Z" fill="url(#wisp-body)" fill-opacity=".18" stroke="#b9d7ff" stroke-width="1" stroke-linejoin="round" opacity=".35"/>
      <circle cx="32" cy="32" r="22" fill="url(#wisp-glow)" opacity=".2"/>
    </g>
    <g id="ghost-regen-2">
