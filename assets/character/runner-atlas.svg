<svg xmlns="http://www.w3.org/2000/svg" width="384" height="192" viewBox="0 0 384 192">
  <title>Neon Maze original runner character atlas</title>
  <desc>18 transparent 64-pixel frames for a floating, round, limbless maze runner.</desc>
  <defs>
    <radialGradient id="runner-body" cx=".32" cy=".24" r=".82">
      <stop stop-color="#fff8bd"/>
      <stop offset=".55" stop-color="#ffe35a"/>
      <stop offset="1" stop-color="#efa82e"/>
    </radialGradient>
    <radialGradient id="runner-power" cx=".3" cy=".22" r=".9">
      <stop stop-color="#fff"/>
      <stop offset=".58" stop-color="#fff4b0"/>
      <stop offset="1" stop-color="#ffc94d"/>
    </radialGradient>
    <linearGradient id="runner-shade" x2=".8" y2="1">
      <stop stop-color="#fff" stop-opacity=".44"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#9b4b17" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="fire-aura">
      <stop stop-color="#ffb449" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff563d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ice-aura">
      <stop stop-color="#b8fbff" stop-opacity=".46"/>
      <stop offset="1" stop-color="#45aaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark-aura">
      <stop stop-color="#f7e3ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#bd5dff" stop-opacity="0"/>
    </radialGradient>
    <g id="runner-open">
      <circle cx="32" cy="32" r="22.5" fill="url(#runner-body)" stroke="#fff1a0" stroke-width="1.3"/>
      <ellipse cx="25" cy="20" rx="11" ry="5" fill="#fff" opacity=".25"/>
      <path d="M31 32 53 21A24.6 24.6 0 0 1 53 43Z" fill="#101a2a"/>
      <ellipse cx="39" cy="20" rx="3.7" ry="5.2" fill="#fffdf3"/>
      <ellipse cx="40.3" cy="20.3" rx="1.65" ry="2.65" fill="#102139"/>
      <path d="M18 42q8 8 15 8" fill="none" stroke="#fff2ad" stroke-width="1.4" stroke-linecap="round" opacity=".72"/>
      <circle cx="32" cy="32" r="21.6" fill="url(#runner-shade)"/>
    </g>
    <g id="runner-closed">
      <circle cx="32" cy="32" r="22.5" fill="url(#runner-body)" stroke="#fff1a0" stroke-width="1.3"/>
      <ellipse cx="25" cy="20" rx="11" ry="5" fill="#fff" opacity=".25"/>
      <path d="M34 32h19" fill="none" stroke="#101a2a" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="39" cy="20" rx="3.7" ry="5.2" fill="#fffdf3"/>
      <ellipse cx="40.3" cy="20.3" rx="1.65" ry="2.65" fill="#102139"/>
      <path d="M18 42q8 8 15 8" fill="none" stroke="#fff2ad" stroke-width="1.4" stroke-linecap="round" opacity=".72"/>
      <circle cx="32" cy="32" r="21.6" fill="url(#runner-shade)"/>
    </g>
    <g id="runner-wide">
      <circle cx="32" cy="32" r="22.5" fill="url(#runner-body)" stroke="#fff1a0" stroke-width="1.3"/>
      <path d="M30 32 52.7 15.8A27.8 27.8 0 0 1 52.7 48.2Z" fill="#101a2a"/>
      <ellipse cx="39" cy="19" rx="3.7" ry="5.2" fill="#fffdf3"/>
      <ellipse cx="40.3" cy="19.3" rx="1.65" ry="2.65" fill="#102139"/>
      <circle cx="32" cy="32" r="21.6" fill="url(#runner-shade)"/>
    </g>
    <g id="runner-hurt">
      <circle cx="32" cy="34" r="21" fill="url(#runner-body)" stroke="#ff9e99" stroke-width="2"/>
      <path d="M31 34 51.8 24A23.1 23.1 0 0 1 51.8 44Z" fill="#101a2a"/>
      <path d="m33 19 4 5-4 3 4 4" fill="none" stroke="#14233a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m47 12 1.5 3.5L52 17l-3.5 1.5L47 22l-1.5-3.5L42 17l3.5-1.5Z" fill="#ff7e91"/>
    </g>
    <g id="runner-fire">
      <circle cx="32" cy="32" r="29" fill="url(#fire-aura)"/>
      <path d="M12 36q-4-10 5-16l-1 8q7-7 6-15 12 9 5 18 9-4 9-13 11 12 5 22" fill="none" stroke="#ff7548" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#runner-open"/>
      <path d="M14 39q-1 7 3 10M50 39q1 7-3 10" fill="none" stroke="#ff8a43" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="runner-ice">
      <circle cx="32" cy="32" r="29" fill="url(#ice-aura)"/>
      <path d="m13 18 4 5-4 3 5 3-3 5M49 16l-3 5 5 4-5 4 4 5" fill="none" stroke="#8ceaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#runner-open"/>
      <path d="m17 13 3 5-3 5-3-5ZM49 39l3 5-3 5-3-5Z" fill="#e4fdff" stroke="#72dafa" stroke-width="1"/>
    </g>
    <g id="runner-electric">
      <circle cx="32" cy="32" r="29" fill="url(#spark-aura)"/>
      <use href="#runner-open"/>
      <path d="m14 24 5 2-4 5 6 1M49 15l-3 5 5 2-4 5M49 43l-4 1 3 5" fill="none" stroke="#db9aff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="15" cy="41" r="1.5" fill="#fff0a8"/><circle cx="50" cy="32" r="1.5" fill="#fff0a8"/>
    </g>
    <g id="pulse-ring">
      <circle cx="32" cy="32" r="26" fill="none" stroke="#79f4ff" stroke-width="2" opacity=".8"/>
      <circle cx="32" cy="32" r="30" fill="none" stroke="#a87bff" stroke-width="1" opacity=".5"/>
    </g>
  </defs>
  <g id="frames">
    <g transform="translate(0 0)"><use href="#runner-open"/></g>
    <g transform="translate(64 0)"><use href="#runner-closed"/></g>
    <g transform="translate(128 0)"><g transform="translate(0 1) scale(1 .96)"><use href="#runner-open"/></g><path d="M108 32h6" stroke="#fff" stroke-width="1" opacity=".7"/></g>
    <g transform="translate(192 0)"><g transform="translate(0 -1) scale(1.02 1.04)"><use href="#runner-closed"/></g></g>
    <g transform="translate(256 0)"><g transform="rotate(-18 288 32)"><use href="#runner-open"/></g></g>
    <g transform="translate(320 0)"><use href="#runner-wide"/></g>
    <g transform="translate(0 64)"><use href="#runner-closed"/><circle cx="7" cy="80" r="2.2" fill="#fff4b7"/><circle cx="55" cy="112" r="1.8" fill="#fff4b7"/></g>
    <g transform="translate(64 64)"><use href="#runner-hurt"/><path d="m117 73 2 4 4 2-4 2-2 4-2-4-4-2 4-2Z" fill="#ff9da4"/></g>
    <g transform="translate(128 64)"><circle cx="160" cy="96" r="29" fill="#fff" opacity=".14"/><use href="#runner-open"/><circle cx="160" cy="96" r="26" fill="none" stroke="#fff6ad" stroke-width="2.2" opacity=".8"/></g>
    <g transform="translate(192 64)"><use href="#runner-fire"/></g>
    <g transform="translate(256 64)"><use href="#runner-ice"/></g>
    <g transform="translate(320 64)"><use href="#runner-electric"/></g>
    <g transform="translate(0 128)"><use href="#runner-open"/><path d="M18 37 4 31M19 44 8 45M20 49 12 55" stroke="#79ecff" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="23" r="2" fill="#d7ffff"/></g>
    <g transform="translate(64 128)"><circle cx="96" cy="160" r="29" fill="#79eaff" opacity=".14"/><circle cx="96" cy="160" r="26" fill="none" stroke="#7aefff" stroke-width="2"/><use href="#runner-closed"/></g>
    <g transform="translate(128 128)"><circle cx="160" cy="160" r="30" fill="none" stroke="#b291ff" stroke-width="2" opacity=".6"/><circle cx="160" cy="160" r="25" fill="none" stroke="#70edff" stroke-width="1.5"/><use href="#runner-closed"/></g>
    <g transform="translate(192 128)"><circle cx="224" cy="160" r="30" fill="#69efff" opacity=".18"/><circle cx="224" cy="160" r="27" fill="none" stroke="#8ef7ff" stroke-width="3"/><use href="#runner-wide"/><path d="m224 126 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#fff"/></g>
    <g transform="translate(256 128)"><use href="#runner-hurt" opacity=".55"/><circle cx="288" cy="160" r="26" fill="none" stroke="#a6edff" stroke-width="2" stroke-dasharray="3 4"/></g>
    <g transform="translate(320 128)"><use href="#runner-open"/><path d="m343 134 2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5Z" fill="#fff2a3"/><path d="m366 169 2 4 4 2-4 2-2 4-2-4-4-2 4-2Z" fill="#8df7ff"/></g>
  </g>
</svg>
