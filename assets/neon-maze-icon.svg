<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="icon-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1c2e"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="icon-pac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1a8"/>
      <stop offset="55%" stop-color="#ffd94d"/>
      <stop offset="100%" stop-color="#ff9b50"/>
    </linearGradient>
    <linearGradient id="icon-ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8fc8"/>
      <stop offset="100%" stop-color="#ff5876"/>
    </linearGradient>
    <filter id="icon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="icon-clip">
      <rect x="8" y="8" width="496" height="496" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icon-clip)">
    <!-- Dark arcade tile -->
    <rect x="8" y="8" width="496" height="496" rx="104" ry="104" fill="url(#icon-tile)"/>

    <!-- Neon maze corridors -->
    <g fill="none" stroke="#35d7ea" stroke-width="14" stroke-linecap="round" opacity="0.5">
      <path d="M72 72 H168 V150"/>
      <path d="M440 72 V168 H360"/>
      <path d="M72 440 V352 H160"/>
      <path d="M440 440 H344 V360"/>
    </g>
    <g fill="none" stroke="#25cfe5" stroke-width="6" stroke-linecap="round" opacity="0.35">
      <path d="M72 256 H132"/>
      <path d="M380 256 H440"/>
    </g>

    <!-- Pac-Man -->
    <g filter="url(#icon-glow)">
      <path d="M214 256 L319 197 A118 118 0 1 0 319 315 Z" fill="url(#icon-pac)"/>
    </g>
    <circle cx="248" cy="203" r="12" fill="#0b1a2e"/>

    <!-- Pellet trail -->
    <g fill="#f5f8ff" opacity="0.9">
      <circle cx="384" cy="228" r="9"/>
      <circle cx="424" cy="268" r="7"/>
      <circle cx="392" cy="312" r="6"/>
    </g>

    <!-- Ghost peeking in from the corner -->
    <g filter="url(#icon-glow)">
      <path d="M336 448 V392 a56 56 0 0 1 112 0 V448 l-19 -18 -18 18 -19 -18 -18 18 -19 -18 Z" fill="url(#icon-ghost)"/>
    </g>
    <circle cx="372" cy="392" r="13" fill="#f5f8ff"/>
    <circle cx="412" cy="392" r="13" fill="#f5f8ff"/>
    <circle cx="376" cy="394" r="7" fill="#172a50"/>
    <circle cx="416" cy="394" r="7" fill="#172a50"/>
  </g>

  <rect x="8" y="8" width="496" height="496" rx="104" ry="104" fill="none" stroke="#25cfe5" stroke-width="6" opacity="0.55"/>
</svg>
