<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="exe-screen-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a12"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="exe-computer-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a323d"/>
      <stop offset="100%" stop-color="#141a22"/>
    </linearGradient>
    <linearGradient id="exe-scp-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ffd32a"/>
    </linearGradient>
    <radialGradient id="exe-pac-grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff580"/>
      <stop offset="40%" stop-color="#ffd32a"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </radialGradient>
    <filter id="exe-glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Containment Monitor Chassis -->
  <rect x="112" y="160" width="288" height="260" rx="16" ry="16" fill="url(#exe-computer-grad)" stroke="#374151" stroke-width="4"/>
  <!-- Monitor Stand Base -->
  <path d="M 226 420 L 216 450 L 296 450 L 286 420 Z" fill="#1e2530" stroke="#374151" stroke-width="2"/>
  <rect x="200" y="450" width="112" height="12" rx="4" fill="#141a22" stroke="#374151" stroke-width="2"/>

  <!-- Screen Bezel & Display -->
  <rect x="130" y="178" width="252" height="224" rx="8" ry="8" fill="url(#exe-screen-grad)" stroke="#111827" stroke-width="3"/>
  
  <!-- SCP Containment Grid & Scanlines -->
  <rect x="138" y="186" width="236" height="208" fill="none" stroke="#ff4757" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <line x1="130" y1="210" x2="382" y2="210" stroke="#00e5ff" stroke-width="1" opacity="0.15"/>
  <line x1="130" y1="240" x2="382" y2="240" stroke="#00e5ff" stroke-width="1" opacity="0.15"/>
  <line x1="130" y1="270" x2="382" y2="270" stroke="#00e5ff" stroke-width="1" opacity="0.15"/>
  <line x1="130" y1="300" x2="382" y2="300" stroke="#00e5ff" stroke-width="1" opacity="0.15"/>
  <line x1="130" y1="330" x2="382" y2="330" stroke="#00e5ff" stroke-width="1" opacity="0.15"/>
  <line x1="130" y1="360" x2="382" y2="360" stroke="#00e5ff" stroke-width="1" opacity="0.15"/>

  <!-- SCP Foundation Containment Arrows -->
  <circle cx="256" cy="285" r="54" fill="none" stroke="url(#exe-scp-grad)" stroke-width="3" stroke-dasharray="14 6" opacity="0.85"/>
  <!-- Top arrow into center -->
  <path d="M 256 215 L 256 242 M 250 236 L 256 244 L 262 236" fill="none" stroke="#ff4757" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom-left arrow into center -->
  <path d="M 195 320 L 218 306 M 214 316 L 220 305 L 209 303" fill="none" stroke="#ff4757" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom-right arrow into center -->
  <path d="M 317 320 L 294 306 M 303 303 L 292 305 L 298 316" fill="none" stroke="#ff4757" stroke-width="3" stroke-linecap="round"/>

  <!-- Clean Animated-Style Pac-Man in Center (NO Limbs) -->
  <g transform="translate(256 285)">
    <!-- Body with chomp wedge -->
    <path d="M 0 0 L 27.28 -15.75 A 31.5 31.5 0 1 1 27.28 15.75 Z" fill="url(#exe-pac-grad)" stroke="#0d141e" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- Mouth Cavity & Tongue -->
    <path d="M 0 0 L 27.28 -15.75 A 31.5 31.5 0 0 1 27.28 15.75 Z" fill="#121820"/>
    <ellipse cx="8.5" cy="7" rx="9" ry="6" fill="#ff4757" opacity="0.9"/>
    <!-- Highlight Curve -->
    <path d="M -22 -6 A 24 24 0 0 1 6 -24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- SCP Explained Eye -->
    <ellipse cx="6" cy="-11" rx="6.5" ry="9" fill="#ffffff" stroke="#0d141e" stroke-width="2.2"/>
    <ellipse cx="7.8" cy="-11" rx="3.8" ry="5.8" fill="#102538"/>
    <circle cx="6.5" cy="-14" r="1.8" fill="#ffffff"/>
    <circle cx="9.2" cy="-9" r="0.9" fill="#ffffff"/>
    <path d="M 1 -23 Q 6 -26 12 -23" fill="none" stroke="#0d141e" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Glowing Ghost Peeking on the Right (SCP Wisps) -->
  <g transform="translate(345 235) scale(0.65)" opacity="0.9">
    <path d="M 12 36 C 12 18, 52 18, 52 36 L 52 48 Q 46 53 40 48 Q 34 43 28 48 Q 22 53 12 48 Z" fill="#00e5ff" stroke="#0d141e" stroke-width="3"/>
    <ellipse cx="25" cy="30" rx="4.5" ry="6.5" fill="#ffffff" stroke="#0d141e" stroke-width="1.8"/>
    <ellipse cx="39" cy="30" rx="4.5" ry="6.5" fill="#ffffff" stroke="#0d141e" stroke-width="1.8"/>
    <circle cx="23" cy="30" r="2.5" fill="#102538"/>
    <circle cx="37" cy="30" r="2.5" fill="#102538"/>
  </g>

  <!-- Bottom Terminal Badge -->
  <rect x="144" y="470" width="224" height="28" rx="6" fill="#0b111a" stroke="#ff4757" stroke-width="1.8"/>
  <text x="256" y="488" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="900" fill="#ffd32a" text-anchor="middle" letter-spacing="2">SCP-PAC_UPDATE.EXE</text>

  <!-- Power LED -->
  <circle cx="256" cy="410" r="4" fill="#00e5ff" filter="url(#exe-glow)"/>
</svg>
