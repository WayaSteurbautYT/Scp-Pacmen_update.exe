<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="ghostcoin-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="60%" stop-color="#b9d7ff"/>
      <stop offset="100%" stop-color="#7fb3d5"/>
    </radialGradient>
    <linearGradient id="ghostcoin-shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Coin outer rim -->
  <circle cx="32" cy="32" r="26" fill="#4a5568" stroke="#2d3748" stroke-width="2"/>
  <circle cx="32" cy="32" r="24" fill="url(#ghostcoin-grad)"/>
  <circle cx="32" cy="32" r="24" fill="url(#ghostcoin-shine)"/>
  <!-- Ghost face -->
  <path d="M22 28c-2-14 3-26 12-30 8-4 18-3 25 3 6 6 8 15 6 27l-1 12-7-5-7 7-7-6-8 6-6-7-7 5Z" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M26 38c-1-12 3-22 10-26" fill="none" stroke="#cbd5e0" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <ellipse cx="26" cy="29" rx="5" ry="7" fill="#fff"/>
  <ellipse cx="40" cy="29" rx="5" ry="7" fill="#fff"/>
  <ellipse cx="27.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
  <ellipse cx="41.5" cy="30" rx="2.5" ry="3.5" fill="#17344e"/>
  <!-- Coin rim highlight -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#fff" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Animated sparkle -->
  <circle cx="48" cy="18" r="3" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
