<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="paccoin-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe477"/>
      <stop offset="60%" stop-color="#ffd94d"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </radialGradient>
    <linearGradient id="paccoin-shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Coin outer rim -->
  <circle cx="32" cy="32" r="26" fill="#b8860b" stroke="#8b6508" stroke-width="2"/>
  <circle cx="32" cy="32" r="24" fill="url(#paccoin-grad)"/>
  <circle cx="32" cy="32" r="24" fill="url(#paccoin-shine)"/>
  <!-- Pac-Man face -->
  <circle cx="32" cy="32" r="14" fill="#ffd94d"/>
  <path d="M32 18 L 44 26 A 12 12 0 0 1 44 46 Z" fill="#08111f"/>
  <path d="M20 26 A 12 12 0 0 0 20 46 Z" fill="#ff9b50"/>
  <circle cx="26" cy="26" r="3" fill="#172a50"/>
  <circle cx="38" cy="26" r="3" fill="#172a50"/>
  <!-- Coin rim highlight -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#fff" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Animated sparkle -->
  <circle cx="48" cy="18" r="3" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
