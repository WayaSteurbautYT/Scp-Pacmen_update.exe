<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05080a"/>
      <stop offset="50%" stop-color="#0a1422"/>
      <stop offset="100%" stop-color="#05080a"/>
    </linearGradient>
    <pattern id="scanlines" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#05080a"/>
      <line x1="0" y1="50" x2="100" y2="50" stroke="#00ff88" stroke-width="1" opacity="0.03"/>
      <line x1="50" y1="0" x2="50" y2="100" stroke="#00ff88" stroke-width="1" opacity="0.03"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>
  <!-- Grid pattern -->
  <rect width="1920" height="1080" fill="url(#scanlines)" opacity="0.15"/>
  <!-- SCP containment border -->
  <rect x="40" y="40" width="1840" height="1000" fill="none" stroke="#ff6c87" stroke-width="2" stroke-dasharray="16 16" opacity="0.4"/>
  <rect x="40" y="40" width="1840" height="1000" fill="none" stroke="#00ff88" stroke-width="1" stroke-dasharray="8 8" opacity="0.2"/>
  <!-- Corner brackets -->
  <path d="M40 40 L 120 40 M40 40 L 40 120" stroke="#ff6c87" stroke-width="3" opacity="0.6"/>
  <path d="M1880 40 L 1800 40 M1880 40 L 1880 120" stroke="#ff6c87" stroke-width="3" opacity="0.6"/>
  <path d="M40 1040 L 120 1040 M40 1040 L 40 960" stroke="#ff6c87" stroke-width="3" opacity="0.6"/>
  <path d="M1880 1040 L 1800 1040 M1880 1040 L 1880 960" stroke="#ff6c87" stroke-width="3" opacity="0.6"/>
  <!-- SCP classification markers -->
  <text x="80" y="80" font-family="monospace" font-size="16" font-weight="bold" fill="#ff6c87" opacity="0.8">SCP-PAC_CONTAINMENT</text>
  <text x="1720" y="80" font-family="monospace" font-size="14" fill="#00ff88" opacity="0.6" text-anchor="end">CLASS: KETER</text>
  <text x="80" y="100" font-family="monospace" font-size="12" fill="#9fb2ca" opacity="0.5">OBJECT CLASS: LIVING GAME</text>
  <!-- Terminal corners -->
  <rect x="80" y="120" width="200" height="3" fill="#00ff88" opacity="0.3"/>
  <rect x="1640" y="120" width="200" height="3" fill="#ff6c87" opacity="0.3"/>
  <!-- Pac-Man ghost silhouettes in background -->
  <g opacity="0.08">
    <circle cx="400" cy="400" r="60" fill="#ff6c87"/>
    <circle cx="430" cy="380" r="12" fill="#fff"/>
    <circle cx="470" cy="380" r="12" fill="#fff"/>
    <circle cx="1000" cy="300" r="60" fill="#00ff88"/>
    <circle cx="1030" cy="280" r="12" fill="#fff"/>
    <circle cx="1070" cy="280" r="12" fill="#fff"/>
    <circle cx="1400" cy="500" r="60" fill="#ffd94d"/>
    <circle cx="1430" cy="480" r="12" fill="#fff"/>
    <circle cx="1470" cy="480" r="12" fill="#fff"/>
  </g>
  <!-- Data readout -->
  <text x="80" y="950" font-family="monospace" font-size="13" fill="#00ff88" opacity="0.7">CONTAINMENT_ACTIVE</text>
  <text x="1840" y="950" font-family="monospace" font-size="13" fill="#ff6c87" opacity="0.7" text-anchor="end">SYSTEM_NOMINAL</text>
  <text x="80" y="970" font-family="monospace" font-size="11" fill="#9fb2ca" opacity="0.4">RESEARCHER_LOG_4605</text>
  <text x="80" y="990" font-family="monospace" font-size="11" fill="#9fb2ca" opacity="0.4">LIVING_GAME_DETECTED</text>
  <!-- Warning pulse -->
  <circle cx="160" cy="1000" r="8" fill="#ff6c87" opacity="0.9">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="180" y="1004" font-family="monospace" font-size="12" fill="#ff6c87" opacity="0.8">ANOMALY_CONTAINED</text>
  <!-- Center focus area (darker for UI) -->
  <rect x="320" y="180" width="1280" height="720" fill="#05080a" opacity="0.4"/>
</svg>
