<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="meat-gradient" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="35%" stop-color="#f57c00"/>
      <stop offset="85%" stop-color="#b73e00"/>
      <stop offset="100%" stop-color="#7a2600"/>
    </radialGradient>
    <linearGradient id="bone-gradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="hunger-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Bone Handle -->
  <g stroke="#1a1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bone knuckle condyles -->
    <circle cx="15" cy="47" r="4.5" fill="url(#bone-gradient)"/>
    <circle cx="19" cy="51" r="4.5" fill="url(#bone-gradient)"/>
    <!-- Bone shaft -->
    <path d="M 17 48 L 29 36" fill="none" stroke="url(#bone-gradient)" stroke-width="6"/>
  </g>

  <!-- Roasted Drumstick Meat -->
  <path d="M 26 39
           C 21 34, 21 24, 28 17
           C 35 10, 48 10, 54 16
           C 60 22, 60 35, 52 42
           C 44 49, 33 46, 26 39 Z"
        fill="url(#meat-gradient)"
        stroke="#1a1410"
        stroke-width="2.5"
        stroke-linejoin="round"
        filter="url(#hunger-glow)"/>

  <!-- Roasted Char Marks / Highlights -->
  <path d="M 33 19 C 39 14, 47 15, 50 18" fill="none" stroke="#ffe082" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 38 27 C 43 23, 49 25, 52 28" fill="none" stroke="#fff3e0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Char accent -->
  <ellipse cx="44" cy="36" rx="4" ry="2" fill="#5c1d00" opacity="0.45" transform="rotate(-35 44 36)"/>
</svg>
